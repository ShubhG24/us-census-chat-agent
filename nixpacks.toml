[phases.setup]
nixPkgs = ["python311", "nodejs-20_x"]

[phases.install]
cmds = [
    "npm install --prefix frontend",
    "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
    "npm run build --prefix frontend",
    "mkdir -p backend/static",
    "cp -r frontend/dist/* backend/static/"
]

[start]
# No script file required: cd into backend/ only when present (repo root vs backend root)
cmd = "sh -c \"(cd backend 2>/dev/null || true) && exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}\""
